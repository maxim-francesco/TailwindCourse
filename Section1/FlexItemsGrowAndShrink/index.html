<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="bg-yellow-500 w-auto flex flex-row">
      <div class="h-10 w-10 bg-red-500 flex-1"></div>
      <div class="h-10 w-10 bg-green-500 flex-1"></div>
      <div class="h-10 w-10 bg-blue-500 flex-1"></div>
    </div>
    <br />
    <div class="bg-yellow-500 w-auto flex flex-row">
      <div class="h-10 w-10 bg-red-500 flex-1"></div>
      <div class="h-10 w-10 bg-green-500 flex-2"></div>
      <div class="h-10 w-10 bg-blue-500 flex-3"></div>
    </div>
    <br />
    <div class="bg-yellow-500 w-auto flex flex-row">
      <div class="h-10 w-80 flex-initial bg-red-500"></div>
      <div class="h-10 w-80 flex-initial bg-green-500"></div>
      <div class="h-10 w-80 flex-initial bg-blue-500"></div>
    </div>

    <br />
    <div class="bg-yellow-500 w-auto flex flex-row">
      <div class="h-10 w-80 flex-auto bg-red-500"></div>
      <div class="h-10 w-80 flex-auto bg-green-500"></div>
      <div class="h-10 w-80 flex-auto bg-blue-500"></div>
    </div>

    <br />
    <div class="bg-yellow-500 w-auto flex flex-row">
      <div class="h-10 w-80 flex-none bg-red-500"></div>
      <div class="h-10 w-80 flex-none bg-green-500"></div>
      <div class="h-10 w-80 flex-none bg-blue-500"></div>
    </div>

    <br />
    <div class="bg-yellow-500 w-auto flex flex-row">
      <div class="h-10 w-80 flex-grow bg-red-500"></div>
      <div class="h-10 w-80 flex-grow bg-green-500"></div>
      <div class="h-10 w-80 flex-grow bg-blue-500"></div>
    </div>

    <br />
    <div class="bg-yellow-500 w-auto flex flex-row">
      <div class="h-10 w-80 flex-grow-0 bg-red-500"></div>
      <div class="h-10 w-80 flex-grow bg-green-500"></div>
      <div class="h-10 w-80 flex-grow bg-blue-500"></div>
    </div>

    <br />
    <div class="bg-yellow-500 w-auto flex flex-row">
      <div class="h-10 w-80 flex-shrink-0 bg-red-500"></div>
      <div class="h-10 w-80 flex-grow bg-green-500"></div>
      <div class="h-10 w-80 flex-grow bg-blue-500"></div>
    </div>

    <br />
    <div class="bg-yellow-500 w-auto flex flex-row">
      <div class="h-10 w-80 flex-shrink-0 bg-red-500 order-2"></div>
      <div class="h-10 w-80 flex-grow bg-green-500 order-3"></div>
      <div class="h-10 w-80 flex-grow bg-blue-500 order-1"></div>
    </div>
  </body>
</html>
