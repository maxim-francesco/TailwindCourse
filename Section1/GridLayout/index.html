<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Layout</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="bg-yellow-500 w-auto grid">
      <div class="bg-red-500 h-20">1</div>
      <div class="bg-green-500 h-20">2</div>
      <div class="bg-blue-500 h-20">3</div>
      <div class="bg-yellow-200 h-20">4</div>
      <div class="bg-purple-500 h-20">5</div>
      <div class="bg-blue-200 h-20">6</div>
    </div>

    <br />

    <div class="bg-yellow-500 w-auto grid grid-cols-3">
      <div class="bg-red-500 h-20">1</div>
      <div class="bg-green-500 h-20">2</div>
      <div class="bg-blue-500 h-20">3</div>
      <div class="bg-yellow-200 h-20">4</div>
      <div class="bg-purple-500 h-20">5</div>
      <div class="bg-blue-200 h-20">6</div>
    </div>

    <br />

    <div class="bg-yellow-500 w-auto grid grid-cols-3 gap-4">
      <div class="bg-red-500 h-20">1</div>
      <div class="bg-green-500 h-20">2</div>
      <div class="bg-blue-500 h-20">3</div>
      <div class="bg-yellow-200 h-20">4</div>
      <div class="bg-purple-500 h-20">5</div>
      <div class="bg-blue-200 h-20">6</div>
    </div>

    <br />

    <div class="bg-yellow-500 w-auto grid grid-cols-3 gap-4">
      <div class="bg-red-500 h-20 col-span-2">1</div>
      <div class="bg-green-500 h-20">2</div>
      <div class="bg-blue-500 h-20">3</div>
      <div class="bg-yellow-200 h-20">4</div>
      <div class="bg-purple-500 h-20">5</div>
      <div class="bg-blue-200 h-20">6</div>
    </div>
  </body>
</html>
