<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Width & Height</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="h-[100px]">
    <div class="bg-red-500 w-0">This is a div element</div>
    <div class="bg-red-500 w-[10px]">This is a div element</div>
    <div class="bg-red-500 w-md">This is a div element</div>
    <div class="bg-green-500 w-lg">This is a div element</div>
    <div class="bg-red-500 w-auto">This is a div element</div>
    <div class="bg-blue-500 w-1/2">This is a div element</div>

    <div class="bg-red-500 w-auto h-[2px]">This is a div element</div>
    <div class="bg-red-500 w-auto h-auto">This is a div element</div>
    <div class="bg-red-500 w-auto h-full">This is a div element</div>
  </body>
</html>
