<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex Wrap</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="bg-yellow-500 w-auto flex flex-row flex-wrap">
      <div class="h-10 w-80 bg-red-500"></div>
      <div class="h-10 w-80 bg-green-500"></div>
      <div class="h-10 w-80 bg-blue-500"></div>
    </div>
    <br />
    <div class="bg-yellow-500 w-auto flex flex-row flex-wrap-reverse">
      <div class="h-10 w-80 bg-red-500"></div>
      <div class="h-10 w-80 bg-green-500"></div>
      <div class="h-10 w-80 bg-blue-500"></div>
    </div>
  </body>
</html>
